<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="title-block">
      <label class="eyebrow" for="car-name">Model name</label>
      <input id="car-name" class="car-name" maxlength="28" spellcheck="false">
    </div>
    <div class="topbar-actions">
      <div class="price-tag">
        <span class="eyebrow">Sticker price</span>
        <strong id="price">$0</strong>
      </div>
      <div class="units" role="group" aria-label="Units">
        <button id="units-metric" type="button">Metric</button>
        <button id="units-imperial" type="button">Imperial</button>
      </div>
      <button id="save" type="button" class="primary">Save to garage</button>
      <a class="race-link" href="race.html">Oval race</a>
      <a class="race-link" href="racetrack.html">RaceTrack circuit</a>
      <button id="reset" type="button">New design</button>
    </div>
  </header>

  <main class="workspace">
    <section class="showroom" aria-label="Car preview and figures">
      <div class="preview-wrap">
        <div id="viewer" class="viewer">
          <canvas id="preview" width="1280" height="520" aria-label="Side view of your car"></canvas>
          <div class="viewer-bar">
            <div id="view-buttons" class="view-buttons" role="group" aria-label="Camera angle"></div>
            <label class="spin"><input type="checkbox" id="auto-rotate"> Spin</label>
            <button type="button" id="view-mode">2D drawing</button>
          </div>
          <p id="viewer-hint" class="viewer-hint">Drag to rotate · scroll to zoom</p>
        </div>
        <p id="engine-summary" class="engine-summary"></p>
      </div>
      <dl id="figures" class="figures"></dl>
      <ul id="warnings" class="warnings"></ul>
    </section>

    <section class="designer" aria-label="Design controls">
      <nav id="tabs" class="tabs" role="tablist"></nav>
      <div id="panel" class="panel"></div>
    </section>

    <section class="card dyno">
      <h2>Dyno</h2>
      <canvas id="dyno" width="1200" height="520" aria-label="Engine power and torque curves"></canvas>
      <div class="legend">
        <span><i class="swatch power"></i>Power (hp)</span>
        <span><i class="swatch torque"></i><span id="torque-legend">Torque (Nm)</span></span>
      </div>
    </section>

    <section class="card market">
      <h2>Market fit</h2>
      <div id="segments" class="meters"></div>
      <h3>Ratings</h3>
      <div id="ratings" class="meters compact"></div>
    </section>

    <section class="card garage">
      <h2>Garage</h2>
      <ul id="garage-list" class="garage-list"></ul>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/viewer3d.js"></script>
  <script src="js/app.js"></script>
  <script src="https://parris-tech-services.github.io/WhirringWilderness/network/portal-adapter.js?v=3"></script>
  <script>PortalAdapter.init("car-game");</script>
</body>
</html>
